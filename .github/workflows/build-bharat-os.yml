name: Build Bharat OS Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "**.jpg"
      - "bharat-os/**"
      - ".github/workflows/build-bharat-os.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install pyinstaller pillow

      - name: Prepare uploaded folder structure
        shell: pwsh
        run: |
          if (-not (Test-Path "bharat-os/Bharat_OS.py")) {
            New-Item -ItemType Directory -Force "bharat-os" | Out-Null
            Copy-Item "Bharat_OS.py", "wp7231692.jpg" -Destination "bharat-os"
            if (Test-Path "bharat") {
              Copy-Item "bharat" -Destination "bharat-os" -Recurse -Force
            } else {
              New-Item -ItemType Directory -Force "bharat-os/bharat" | Out-Null
              Copy-Item "__init__.py", "security.py", "downloader.py", "system_tools.py", "paths.py" -Destination "bharat-os/bharat"
            }
          }

      - name: Check Python code
        working-directory: bharat-os
        run: |
          python -m compileall -q .
          python -c "import Bharat_OS; from bharat import security, downloader, system_tools; from PIL import ImageTk"

      - name: Build EXE
        working-directory: bharat-os
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Bharat-OS
          --add-data "wp7231692.jpg;."
          --collect-all PIL
          Bharat_OS.py

      - name: Check EXE opens
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "bharat-os/dist/Bharat-OS.exe" -PassThru
          try {
            $found = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              $windows = Get-Process -Name "Bharat-OS" -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowTitle -like "Bharat OS*" }

              if ($windows) {
                $found = $true
                break
              }

              $process.Refresh()
              if ($process.HasExited) {
                throw "EXE exited before opening its window"
              }
            }

            if (-not $found) {
              throw "No Bharat OS window appeared"
            }
          } finally {
            Get-Process -Name "Bharat-OS" -ErrorAction SilentlyContinue |
              Stop-Process -Force
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Bharat-OS-Windows
          path: bharat-os/dist/Bharat-OS.exe
          if-no-files-found: error
